extends: existence
message: 'Possible editing-session residue: ''%s''. Check its purpose against the original notes; retain
  legitimate discussion or quotations.'
level: warning
scope: text
ignorecase: true
nonword: true
vocab: false
tokens:
- \bhere(?:\s+is|'s|’s)\s+the\s+(?:revised|rewritten|updated|edited|polished)\s+(?:article|draft|version|text|document|ADR|PRD|RFC|proposal|specification)\b
- \b(?:based\s+on|in\s+response\s+to)\s+your\s+(?:feedback|editorial\s+notes|revision\s+request)\b
- \bas\s+you\s+(?:requested|asked)\b
- '\b(?:editorial\s+note|note\s+to\s+(?:the\s+)?(?:writer|editor))\s*:'
# Chat replies pasted into the document. "I hope this helps", "Would you like me to" and
# "Let me know if" are left out: people write them in issue threads.
- \bI\s+hope\s+this\s+(?:message|email)\s+finds\s+you\s+well\b
- (?:^|[.!?]\s+)(?:certainly|of\s+course|absolutely|great\s+question)!
- \byou(?:'|’|\s+a)re\s+absolutely\s+right\b
- \bis\s+there\s+anything\s+else\s+(?:I\s+can|you(?:'|’)d\s+like)\b
- \bas\s+(?:an\s+AI(?:\s+language\s+model)?|a\s+large\s+language\s+model),\s+I\b
- \b(?:as\s+of|up\s+to)\s+my\s+(?:last\s+)?(?:knowledge|training)\s+(?:cutoff|cut-off|update)\b
tests:
- name: detects a response wrapper
  input: Here is the revised article.
  contains: Workflow.ProcessLeakage
- name: detects a curly apostrophe wrapper
  input: Here’s the updated draft.
  contains: Workflow.ProcessLeakage
- name: detects a reference to revision feedback
  input: Based on your feedback, this version uses shorter paragraphs.
  contains: Workflow.ProcessLeakage
- name: detects an explicit writer instruction
  input: 'Note to the writer: add an example here.'
  contains: Workflow.ProcessLeakage
- name: useful article signposting is not residue
  input: This article explains how a review queue grows.
  want: ''
- name: a heading about editorial work is not residue
  input: '# Editorial notes


    Writers can keep production notes outside the article.'
  want: ''
- name: indirect leakage is a documented blind spot
  input: Although mentoring is beyond this article’s scope, reviews remain important.
  want: ''
- name: detects an RFC response wrapper
  input: Here is the revised RFC.
  contains: Workflow.ProcessLeakage
- name: technical non-goals are not process contamination
  input: '## Non-goals


    Cross-region failover is outside the scope of this proposal.'
  want: ''
- name: detects a chat greeting
  input: I hope this message finds you well.
  contains: Workflow.ProcessLeakage
- name: detects a model self-description
  input: As an AI language model, I cannot browse.
  contains: Workflow.ProcessLeakage
- name: an AI product feature is not residue
  input: Register the bot as an AI provider, or as a large language model backend.
  want: ''
- name: detects a chat opener
  input: Certainly! The cache is local.
  contains: Workflow.ProcessLeakage
- name: detects a follow-up offer across a line break
  input: "Is there anything\nelse I can do?"
  contains: Workflow.ProcessLeakage
- name: detects a knowledge-cutoff disclaimer
  input: As of my last knowledge update, v2 is current.
  contains: Workflow.ProcessLeakage
- name: certainly inside a sentence is ordinary prose
  input: The job certainly fails without a key. Certainly not.
  want: ''
- name: issue-thread wording is ordinary
  input: Let me know if the migration fails. I hope this helps. Would you like me to open a PR?
  want: ''
- name: quoted bot output is a documented blind spot
  input: "The bot replied: 'I hope this message finds you well.'"
  contains: Workflow.ProcessLeakage
- name: decision rationale may mention a real prior review
  input: The architecture review identified a single point of failure.
  want: ''
