# Tables, headings and code are not counted. The first paragraph of a list item or blockquote is not
# counted either; later paragraphs in them are.
extends: occurrence
message: 'More than 200 whitespace-separated tokens in one paragraph: check whether the argument turns
  inside it. Break only where it turns, not to shorten the block.'
level: suggestion
scope: paragraph & ~table & ~heading
max: 200
token: \S+
tests:
- name: flags more than the review threshold
  input: 'The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. The worker reads the message and checks the key. It stops now.'
  contains: Clarity.LongParagraph
