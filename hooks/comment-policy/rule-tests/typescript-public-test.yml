id: typescript-public-decl-vue
valid:
  - "withDefaults(props, { size: 1 })"
  - "defineProps<{}>()"
  - "interface Other { p: string }"
  - "const o = { props: { a: 1 } }"
  - "defineComponent({ data: { a: 1 } })"
  - "const n = useModel()"
invalid:
  - "defineProps<{ title: string }>()"
  - "defineEmits<{ (e: 'change', id: number): void }>()"
