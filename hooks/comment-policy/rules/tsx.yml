id: tsx-comment
language: tsx
rule:
  kind: comment
---
# Names of exported declarations, and of the members of exported classes and
# interfaces, whose JSDoc convention expects a doc comment. The name node keeps
# the scan output small; decorators between a doc and its declaration are
# matched by tsx-attribute.
id: tsx-public-decl
language: tsx
rule:
  all:
    - any:
        - kind: identifier
        - kind: type_identifier
        - kind: property_identifier
    - inside:
        field: name
        any:
          - kind: function_declaration
          - kind: generator_function_declaration
          - kind: function_signature
          - kind: class_declaration
          - kind: abstract_class_declaration
          - kind: interface_declaration
          - kind: type_alias_declaration
          - kind: enum_declaration
          - kind: internal_module
          - kind: variable_declarator
          - kind: method_definition
          - kind: method_signature
          - kind: abstract_method_signature
          - kind: property_signature
          - kind: public_field_definition
    - inside:
        kind: export_statement
        stopBy: end
    # A name declared in a function or namespace body, or in an object literal, is local.
    - not:
        inside:
          any:
            - kind: statement_block
            - kind: object
          stopBy: end
    # A private member is not public API, whatever its class.
    - not:
        inside:
          has:
            kind: accessibility_modifier
            regex: '^private$'
---
# Decorators sit between a doc comment and its declaration.
id: tsx-attribute
language: tsx
rule:
  kind: decorator
---
# Members of a Vue component's props, emits and slots, and its defineModel
# bindings: Vue's language tools show their JSDoc to the component's users.
# They are declared through compiler macros or an options object, neither of
# which is exported; tsx-public-decl-vue-local covers a named local type.
id: tsx-public-decl-vue
language: tsx
utils:
  macro-call:
    kind: call_expression
    has:
      field: function
      regex: '^define(Props|Emits|Slots)$'
  member-name:
    any:
      - kind: property_identifier
      - kind: string
rule:
  any:
    # defineProps<{ title: string }>(), defineEmits<{ (e: 'change'): void }>()
    - all:
        - matches: member-name
        - inside:
            field: name
            any: [{ kind: property_signature }, { kind: method_signature }]
            inside: { kind: object_type, inside: { kind: type_arguments, inside: { matches: macro-call } } }
    - all:
        - kind: call_signature
        - inside: { kind: object_type, inside: { kind: type_arguments, inside: { matches: macro-call } } }
    # defineProps({ title: String }), defineEmits({ change: null })
    - all:
        - matches: member-name
        - inside: { field: key, kind: pair, inside: { kind: object, inside: { kind: arguments, inside: { matches: macro-call } } } }
    # props and emits of defineComponent({...}) or export default {...}
    - all:
        - matches: member-name
        - inside:
            field: key
            kind: pair
            inside:
              kind: object
              inside:
                field: value
                kind: pair
                has: { field: key, regex: '^(props|emits)$' }
                inside:
                  kind: object
                  any:
                    - inside: { kind: arguments, inside: { kind: call_expression, has: { field: function, regex: '^defineComponent$' } } }
                    - inside: { kind: export_statement }
    # const title = defineModel<string>()
    - all:
        - kind: identifier
        - inside:
            field: name
            kind: variable_declarator
            has: { field: value, kind: call_expression, has: { field: function, regex: '^defineModel$' } }
---
# Members of a local interface or type that a Vue macro names in its type
# argument, as in interface Props { ... } with defineProps<Props>(). The macros
# exist only in a component's <script setup>, at the top level, so the search
# for the macro is limited to the top-level statements of .vue files: a search
# of the whole tree for every member made a scan quadratic in file size.
id: tsx-public-decl-vue-local
language: tsx
files: ['**/*.vue']
utils:
  macro-of-api:
    kind: call_expression
    all:
      - has: { field: function, regex: '^define(Props|Emits|Slots)$' }
      - has: { field: type_arguments, has: { kind: type_identifier, pattern: $API } }
  macro-or-defaults:
    any:
      - matches: macro-of-api
      - kind: call_expression
        all:
          - has: { field: function, regex: '^withDefaults$' }
          - has: { field: arguments, has: { matches: macro-of-api } }
rule:
  all:
    - any: [{ kind: property_identifier }, { kind: string }]
    - inside:
        field: name
        any: [{ kind: property_signature }, { kind: method_signature }]
        inside:
          any:
            - inside: { field: body, kind: interface_declaration, has: { field: name, pattern: $API } }
            - inside: { field: value, kind: type_alias_declaration, has: { field: name, pattern: $API } }
          inside:
            kind: program
            stopBy: end
            has:
              any:
                - kind: expression_statement
                  has: { matches: macro-or-defaults }
                - any: [{ kind: lexical_declaration }, { kind: variable_declaration }]
                  has: { kind: variable_declarator, has: { field: value, matches: macro-or-defaults } }
