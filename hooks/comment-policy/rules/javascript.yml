id: javascript-comment
language: javascript
rule:
  kind: comment
---
# Names of exported declarations, and of the members of exported classes and
# interfaces, whose JSDoc convention expects a doc comment. The name node keeps
# the scan output small; decorators between a doc and its declaration are
# matched by javascript-attribute.
id: javascript-public-decl
language: javascript
rule:
  all:
    - any:
        - kind: identifier
        - kind: property_identifier
    - inside:
        field: name
        any:
          - kind: function_declaration
          - kind: generator_function_declaration
          - kind: class_declaration
          - kind: variable_declarator
          - kind: method_definition
    - inside:
        kind: export_statement
        stopBy: end
    # A name declared in a function or namespace body, or in an object literal, is local.
    - not:
        inside:
          any:
            - kind: statement_block
            - kind: object
          stopBy: end
---
# Decorators sit between a doc comment and its declaration.
id: javascript-attribute
language: javascript
rule:
  kind: decorator
---
# Members of a Vue component's props and emits, and its defineModel bindings:
# Vue's language tools show their JSDoc to the component's users. They are
# declared through compiler macros or an options object, neither of which is
# exported.
id: javascript-public-decl-vue
language: javascript
utils:
  macro-call:
    kind: call_expression
    has:
      field: function
      regex: '^define(Props|Emits|Slots)$'
  member-name:
    any:
      - kind: property_identifier
      - kind: string
rule:
  any:
    # defineProps({ title: String }), defineEmits({ change: null })
    - all:
        - matches: member-name
        - inside: { field: key, kind: pair, inside: { kind: object, inside: { kind: arguments, inside: { matches: macro-call } } } }
    # props and emits of defineComponent({...}) or export default {...}
    - all:
        - matches: member-name
        - inside:
            field: key
            kind: pair
            inside:
              kind: object
              inside:
                field: value
                kind: pair
                has: { field: key, regex: '^(props|emits)$' }
                inside:
                  kind: object
                  any:
                    - inside: { kind: arguments, inside: { kind: call_expression, has: { field: function, regex: '^defineComponent$' } } }
                    - inside: { kind: export_statement }
    # const title = defineModel<string>()
    - all:
        - kind: identifier
        - inside:
            field: name
            kind: variable_declarator
            has: { field: value, kind: call_expression, has: { field: function, regex: '^defineModel$' } }
