# British-English technical documentation; Vale 3.24.0 target.
# Run scripts/setup-dictionary.py before the first lint.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = TechnicalDocs

# Preserve code exclusions. Do not skip all blockquotes: docs use them as callouts.
SkippedScopes = script, style, pre, figure, noscript, iframe

[*.{md,markdown,mdown,markdn}]
BasedOnStyles = Vale, Technical, Clarity, Workflow, Requirements

# Replace the built-in American dictionary with Technical.Spelling (en_GB).
Vale.Spelling = NO
Vale.Repetition = warning
Vale.Terms = warning
Vale.Avoid = warning
