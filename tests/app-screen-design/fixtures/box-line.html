<!doctype html>
<html>
<head>
<style>
  body { margin: 0; padding: 24px; background: #f8f8f8; color: #0a0a0a; font: 14px/1.2 Arial, sans-serif; display: flex; gap: 24px; }
  .panel { width: 320px; background: #fff; border: 1px solid #e6e6e6; border-radius: 8px; padding: 12px 0; }
  .text { padding: 8px 16px; }
  button { display: block; height: 32px; padding: 0 7px; border: 1px solid #d4d4d4; border-radius: 6px; background: #fff; font: inherit; }
</style>
</head>
<body>
  <div class="panel" aria-label="Nested box">
    <div class="text">Notifications</div>
    <div class="text">Email digests</div>
    <button style="margin-left:8px">Change plan</button>
  </div>
  <div class="panel" aria-label="Box on text line">
    <div class="text">Notifications</div>
    <div class="text">Email digests</div>
    <button style="margin-left:16px">Change plan</button>
  </div>
</body>
</html>
