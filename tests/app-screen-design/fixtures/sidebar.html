<!doctype html>
<html>
<head>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px/1.2 Arial, sans-serif; }
  aside { width: 240px; height: 520px; background: #1b1b1b; padding: 8px 0; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; color: inherit; text-decoration: none; }
  .row svg { flex: none; }
  .active { background: #2c2c2c; margin: 0 4px; padding: 0 8px; border-radius: 6px; }
  .count { margin-left: auto; background: #333; padding: 0 6px; border-radius: 4px; }
  .group { height: 32px; display: flex; align-items: center; padding: 0 12px; color: #888; }
  .child { padding-left: 36px; }
  input { display: block; box-sizing: border-box; width: calc(100% - 16px); height: 28px; margin: 0 8px 4px; padding: 0 3px; border: 1px solid #444; background: #222; color: #eee; font: inherit; }
</style>
</head>
<body>
  <aside aria-label="Sidebar">
    <nav aria-label="Primary">
      <input placeholder="Search">
      <a class="row active" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span style="margin-left:2px">Inbox</span><span class="count">3</span></a>
      <a class="row" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span>My issues</span><span class="count" style="margin-right:3px">12</span></a>
      <a class="row" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span>Reviews</span><span class="count">2</span></a>
      <div class="group">Favorites</div>
      <a class="row" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span>Roadmap</span></a>
      <div class="group" style="padding-left:15px">Workspace</div>
      <a class="row" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span style="position:relative;top:3px">Views</span></a>
      <a class="row" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span>Projects</span></a>
      <a class="row child" href="#"><svg width="16" height="16"><rect width="16" height="16" fill="#888"/></svg><span>Backlog</span></a>
      <div class="group">Teams</div>
    </nav>
  </aside>
</body>
</html>
